name: CI/CD - Docker to GHCR

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: 🧪 Run Test Suite
    runs-on: ubuntu-latest
    
    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🐳 Start databases
        run: |
          docker-compose up -d
          # Wait for databases to be ready
          sleep 10

      - name: 🚀 Start server for E2E and API tests
        run: |
          npm start & # Run the server in the background
          # Wait for the server to be ready
          sleep 5

      - name: ✅ Run unit and integration tests (Jest)
        run: npm test

      - name: 🌐 Run Cypress E2E tests
        run: npm run test:e2e

      - name: 📝 Run API tests (Newman) and get report
        run: npm run test:api:ci

  build-and-push:
    name: 🐳 Build and Push Docker image to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v3
      - name: 🔐 Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 🏗️ Build Docker image
        run: |
          REPO_NAME="${{ github.repository }}"
          REPO_LOWER=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/$REPO_LOWER:latest"
          echo "Building image $IMAGE_NAME"
          docker build -t $IMAGE_NAME .
      - name: 🚀 Push Docker image to GHCR
        run: |
          REPO_NAME="${{ github.repository }}"
          REPO_LOWER=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/$REPO_LOWER:latest"
          echo "Pushing image $IMAGE_NAME"
          docker push $IMAGE_NAME
      - name: 🏷️ Add additional tags
        run: |
          REPO_NAME="${{ github.repository }}"
          REPO_LOWER=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          docker tag ghcr.io/$REPO_LOWER:latest ghcr.io/$REPO_LOWER:${{ github.sha }}
          docker push ghcr.io/$REPO_LOWER:${{ github.sha }}
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's/refs\/heads\///')
            docker tag ghcr.io/$REPO_LOWER:latest ghcr.io/$REPO_LOWER:$BRANCH_NAME
            docker push ghcr.io/$REPO_LOWER:$BRANCH_NAME
          fi