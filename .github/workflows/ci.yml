name: CI Pipeline

on:
  push:
    branches:
      - main  # Trigger the workflow on main branch
      - feature/*  # Also trigger it on feature branches (like feature/initial-setup)

jobs:
  test:
    runs-on: windows-latest  # You can also choose other OS runners

    steps:
      # Checkout the main branch (the branch that contains the workflow)
      - name: Checkout the main branch
        uses: actions/checkout@v2
        with:
          ref: main  # Checkout main branch for workflow file and other necessary code

      # Checkout the feature/initial-setup branch (contains package.json)
      - name: Checkout feature/initial-setup branch
        uses: actions/checkout@v2
        with:
          ref: feature/initial-setup  # Checkout the branch that contains package.json
          path: ./ClauseBusters  # Store files from feature/initial-setup in the ClauseBusters directory

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'  # You can adjust this to your Node.js version

      # Install dependencies using package.json from the feature/initial-setup branch
      - name: Install dependencies
        run: npm install
        working-directory: ./ClauseBusters  # Install dependencies in the right folder (ClauseBusters)

      # Run tests defined in package.json from feature/initial-setup
      - name: Run tests
        run: npm test
        working-directory: ./ClauseBusters  # Run tests in the same directory as package.json
