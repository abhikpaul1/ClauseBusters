name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/* # Will run CI on feature branches too

jobs:
  test:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'
      
      - name: Install dependencies
        run: npm install
        
      - name: Run tests
        run: npm test
        